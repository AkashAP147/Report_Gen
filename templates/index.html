<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Generator Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>Report Generator</h1>
            <p>Upload your session file to instantly configure and download reports.</p>
        </header>

        <main>
            <!-- Step 1: Upload -->
            <div id="step-1" class="step-container active">
                <div class="upload-area" id="upload-area">
                    <input type="file" id="file-input" accept=".xls,.xlsx,.csv" hidden>
                    <div class="upload-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-upload-cloud"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
                    </div>
                    <h3>Drag & Drop your file here</h3>
                    <p>or <span class="browse-link">browse files</span></p>
                </div>
                <div id="parse-progress" class="progress-container" style="display: none;">
                    <div class="spinner"></div>
                    <span class="progress-text">Analyzing file...</span>
                </div>
            </div>

            <!-- Step 2: Configure & Generate -->
            <div id="step-2" class="step-container">
                <div class="file-details">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></svg>
                    <span id="file-name">filename.xls</span>
                </div>

                <div class="config-panel">
                    <h3>Seating Preferences</h3>
                    <p class="config-subtitle">Select which branches to alternate between first.</p>
                    
                    <div class="form-group">
                        <label for="pref-left">Primary Branch (Left Desks):</label>
                        <select id="pref-left" class="select-input">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="pref-right">Secondary Branch (Right Desks):</label>
                        <select id="pref-right" class="select-input">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                </div>
                
                <div class="progress-container" id="generate-progress" style="display: none;">
                    <div class="spinner"></div>
                    <span class="progress-text">Generating & Downloading files...</span>
                </div>
                
                <button id="generate-btn" class="primary-btn">Generate & Download Files</button>
            </div>
            
            <div id="error-message" class="error-message"></div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
